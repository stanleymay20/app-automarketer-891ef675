name: AutoMarketer Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - bun.lock
      - .github/workflows/dependency-audit.yml
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - bun.lock
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automarketer-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Verify npm lock
        run: npm ci --no-audit --no-fund

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Bun lock
        run: bun install --frozen-lockfile

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Full dependency audit
        run: npm audit --audit-level=high
