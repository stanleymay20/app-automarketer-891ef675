name: AutoMarketer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automarketer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keep every gate visible even when an earlier one fails. The final gate
      # still fails the job if any validation step failed, so this does not
      # weaken CI; it only prevents lint from masking test/build failures.
      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint

      - name: Test
        id: test
        if: always()
        continue-on-error: true
        run: bun run test

      - name: Build
        id: build
        if: always()
        continue-on-error: true
        env:
          # CI build only needs placeholders; real values come from Lovable at runtime.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
        run: bun run build

      - name: Validation gate
        if: always()
        shell: bash
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          echo "test=${{ steps.test.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          if [[ "${{ steps.lint.outcome }}" != "success" || \
                "${{ steps.test.outcome }}" != "success" || \
                "${{ steps.build.outcome }}" != "success" ]]; then
            exit 1
          fi
