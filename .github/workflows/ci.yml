name: AutoMarketer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automarketer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chatgpt-connector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check managed bridge entrypoint
        working-directory: .
        run: deno check --no-config --node-modules-dir=none --no-lock supabase/functions/chatgpt-connector-bridge/index.ts

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        env:
          # CI build only needs placeholders; real values come from Lovable at runtime.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
        run: bun run build
