name: AutoMarketer Controlled Dependency Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automarketer-dependency-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Use current npm resolver
        run: |
          npm install --global npm@latest
          npm --version

      - name: Set patched dependency versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies['react-router-dom'] = '^7.18.3';
          p.devDependencies['vite'] = '^6.4.3';
          p.devDependencies['@vitejs/plugin-react-swc'] = '^4.3.3';
          p.devDependencies['vitest'] = '^4.1.11';
          p.devDependencies['lovable-tagger'] = '^1.3.3';
          p.devDependencies['postcss'] = '^8.5.28';
          p.devDependencies['tailwindcss'] = '^3.4.19';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

      - name: Regenerate npm lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Regenerate Bun lock
        run: bun install

      - name: Verify Bun lock
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
        run: bun run build

      - name: Gate production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Gate full dependency tree
        run: npm audit --audit-level=high

      - name: Verify controlled change set
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected=$(printf '%s\n' bun.lock package-lock.json package.json | sort)
          test "$changed" = "$expected"

      - name: Commit validated dependency graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json bun.lock
          git commit -m "Harden AutoMarketer dependency graph [skip ci]"
          git push origin HEAD:main
